<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - E-commerce</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="src/css/styles.css">
</head>
<body>
    <header class="header">
        <h1 class="logo">E-Commerce</h1>
        
        <nav style=";display:flex;align-items:center;height:56px;gap:24px;">
            <div class="admin-nav" style="display:flex;gap:4px;">
                <a data-section="dashboard" onclick="navigateTo('dashboard')" style="color:#a0aec0;text-decoration:none;padding:6px 14px;border-radius:8px;font-size:14px;cursor:pointer;">Dashboard</a>
                <a data-section="stores" onclick="navigateTo('stores')" style="color:#a0aec0;text-decoration:none;padding:6px 14px;border-radius:8px;font-size:14px;cursor:pointer;">Lojas</a>
                <a data-section="users" onclick="navigateTo('users')" style="color:#a0aec0;text-decoration:none;padding:6px 14px;border-radius:8px;font-size:14px;cursor:pointer;">Usuários</a>
                <a data-section="products" onclick="navigateTo('products')" style="color:#a0aec0;text-decoration:none;padding:6px 14px;border-radius:8px;font-size:14px;cursor:pointer;">Produtos</a>
                <a data-section="purchases" onclick="navigateTo('purchases')" style="color:#a0aec0;text-decoration:none;padding:6px 14px;border-radius:8px;font-size:14px;cursor:pointer;">Pedidos</a>
            </div>
        </nav>
        
        <div class="btns">  
            <button onClick="window.location.href='index.html'">Voltar <i class="fas fa-arrow-right"></i></button>
        </div>
    </header>
    
    <div id="admin-content" style="padding-top:56px;"></div>
    
    <script src="src/js/admin.js"></script>
</body>
</html>
